name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Postgres and River adapter tests run against this; they skip when
      # SHINRIN_TEST_DATABASE_URL is unset (local runs without a database).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shinrin
          POSTGRES_PASSWORD: shinrin
          POSTGRES_DB: shinrin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shinrin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SHINRIN_TEST_DATABASE_URL: postgres://shinrin:shinrin@localhost:5432/shinrin_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  # The production images (docs/deploy.md). Built, not pushed: this catches a
  # broken Dockerfile or compose file before anyone deploys.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        working-directory: deploy
        run: |
          cp .env.example .env && cp shinrin.env.example shinrin.env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^CLOUDFLARE_TUNNEL_TOKEN=$/CLOUDFLARE_TUNNEL_TOKEN=ci/' .env
          docker compose config --quiet
      - run: docker build -t shinrin-backend backend
      - run: docker build -t shinrin-web web
